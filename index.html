<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>cosmo time machine</title>
  </head>
  <body>
    <div class="fundo" aria-hidden="true">
      <div class="star"></div>
      <div class="feixe"></div>
      <div class="ring"></div>
      <div class="luz"></div>
    </div>

    <header class="topo">
      <span class="logo-icone">✦</span> Cosmo Time Machine
    </header>
    <main>
      <section class="hero">
        <h1>Viaje no <em>tempo</em> pelo céu</h1>
        <p class="subtitulo">
          Como estava o céu naquele dia? Escolha uma data e veja a foto que a
          NASA mostrou ao mundo.
        </p>

        <div class="controles">
          <label for="data">Escolha uma data:</label>
          <input type="date" id="data" />
          <button id="buscar">Buscar</button>
        </div>
      </section>
      <section id="resultado"></section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
